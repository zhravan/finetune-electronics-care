name: Deploy Finetune to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      # Custom domain is hosted at the origin root, not under /<repository>/.
      # Set the VITE_SITE_URL repository variable only when overriding this.
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://finetuneelectronics.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Validate public site address
        run: node --input-type=module -e "import { pagesOrigin } from './scripts/prepare-github-pages.mjs'; pagesOrigin(process.env.VITE_SITE_URL);"
      - run: bun run build
      - run: node scripts/prepare-github-pages.mjs .output/public
      - name: Ensure custom-domain asset URLs use the domain root
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { resolve, relative, dirname } from 'node:path';

          const root = resolve('.output/public');
          async function walk(folder) {
            for (const entry of await readdir(folder, { withFileTypes: true })) {
              const file = resolve(folder, entry.name);
              if (entry.isDirectory()) {
                await walk(file);
                continue;
              }
              if (entry.name !== 'index.html') continue;
              let html = await readFile(file, 'utf8');
              // For a custom domain, generated asset and favicon paths must be root-relative.
              html = html.replaceAll('/finetune-electronics-care/assets/', '/assets/');
              html = html.replaceAll('/finetune-electronics-care/favicon.png', '/favicon.png');
              await writeFile(file, html);
              console.log(`Checked asset paths in ${relative(root, file) || 'index.html'}`);
            }
          }
          await walk(root);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
