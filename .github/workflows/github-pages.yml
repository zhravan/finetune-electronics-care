name: Deploy Finetune to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      # The default is this repository's project Pages URL. Override for a custom domain.
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://zhravan.github.io/finetune-electronics-care' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Validate public site address
        run: node --input-type=module -e "import { pagesOrigin } from './scripts/prepare-github-pages.mjs'; pagesOrigin(process.env.VITE_SITE_URL);"
      - run: bun run build
      - run: node scripts/prepare-github-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
